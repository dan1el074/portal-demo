# Spring
spring.application.name=portal
spring.profiles.active=${APP_PROFILE:dev}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

# OpenAPI / Swagger UI
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# Vídeos / Bunny Stream
bunny.stream.api-key=${BUNNY_STREAM_API_KEY:}
bunny.stream.library-id=${BUNNY_STREAM_LIBRARY_ID:}
bunny.stream.embed-base-url=${BUNNY_STREAM_EMBED_BASE_URL:https://player.mediadelivery.net/embed}

# Segurança
security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}
security.jwt.duration=${JWT_DURATION:86400}
cors.origins=${CORS_ORIGINS:http://localhost:4200}

# Arquivos
app.server.image-path=${IMAGE_PATH:C:\\workspace\\outros\\imagens}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB
