<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="needs-validation" autocomplete="on">
  <div [cFormFloating]="true" class="mb-3">
    <input cFormControl [valid]="valid" formControlName="username" id="pmusername" name="username" type="text" placeholder="Usuário" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required />
    <label cLabel for="pmusername">Usuário</label>
  </div>
  <div cFormFloating class="fix-eye">
    <input cFormPassword [valid]="valid" formControlName="password" id="password" type="password" placeholder="Senha" autocomplete="off" floatingLabel="Senha" required />
  </div>

  <a href="https://wa.me/555421060260" style="outline: none;" target="_blank">Falar com um administrador</a>
  <button type="submit">Entrar</button>
</form>
