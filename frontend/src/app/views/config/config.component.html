<c-container breakpoint="lg" class="h-auto px-4 config-width" fluid>
  <p class="ops-header">
    <span class="ops-welcome">Configurações</span>
    <span class="ops-access-level">Atualize suas informações pessoais e credenciais de acesso</span>
  </p>

  @if (loaded && userData) {
    <app-user-config-form
      [userData]="userData"
      (editTask)="updateConfig($event)">
    </app-user-config-form>

    @if (isAdmin) {
      <c-card class="admin-settings border p-3">
        <c-card-body>
          <hr>
          <span class="admin-section-title">ADMINISTRAÇÃO</span>

          <p>Limpe os dados armazenados em cache pelo sistema.</p>

          <div class="admin-button-container">
            <button class="save-button" type="button" (click)="clearCache()">
              Limpar cache
            </button>
          </div>
        </c-card-body>
      </c-card>
    }
  } @else {
    <i>Carregando...</i>
  }
</c-container>
