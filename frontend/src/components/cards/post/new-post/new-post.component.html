<c-card class="border">
  <c-card-body>
    <div class="new-post-container">
      <c-avatar shape="rounded-1" size="md" [src]="user.pictureId ? apiUrl + '/images/' + user.pictureId : './assets/images/avatars/default.png'" textColor="primary" alt="Avatar do usuário" />
      <button (click)="openModal()" class="modal-button">
        <span class="default-prompt">No que você está pensando?</span>
        <span class="compact-prompt">Criar publicação</span>
      </button>
    </div>
    <hr>
    <div class="buttons-container">
      <button class="action-btn" (click)="openModal(true)">
        <span class="action-icon image-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m4 17 5-5 4 4 2-2 5 4"></path></svg></span>
        Imagens
      </button>
      <button (click)="eventTask.emit()" class="action-btn">
        <span class="action-icon event-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path><path d="M8 14h3M8 17h6"></path></svg></span>
        Evento
      </button>
    </div>
  </c-card-body>
</c-card>

<app-new-post-modal [visible]="showModal" [openDialog]="showPictureDialog" [user]="user" [editingPost]="editingPost" (closeTask)="closeModal()" (publishTask)="publishPost($event)"></app-new-post-modal>
