@if (presented.length) {
  <div class="evidence-gallery">
    @for (item of presented; track item.id) {
      <figure class="evidence-item" [class.video-evidence]="isVideo(item)">
        @if (isImage(item) && (item.source || item.publicUrl)) {
          <button type="button" class="evidence-image-link no-print" (click)="openImage(item)" [attr.aria-label]="'Abrir ' + item.name + ' em uma nova guia'">
            <img [src]="item.source || item.publicUrl" [alt]="item.name" />
          </button>
          <img class="print-image print-only" [src]="item.source || item.publicUrl" [alt]="item.name" />
        } @else if (isVideo(item)) {
          <div class="video-preview no-print">
            @if (item.safePublicUrl) {
              <iframe [src]="item.safePublicUrl" [title]="item.name" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
            } @else if (item.source) {
              <video [src]="item.source" controls preload="metadata"></video>
            } @else {
              <div class="unavailable-media"><app-checklist-icon name="file-text" /><span>Prévia indisponível nesta sessão</span></div>
            }
          </div>
          <div class="video-qr">
            @if (item.qrCode) {
              <img [src]="item.qrCode" [alt]="'QR Code para assistir ' + item.name" />
              <span>Escaneie para assistir ao vídeo</span>
            } @else {
              <div class="qr-placeholder"><app-checklist-icon name="file-text" /></div>
              <span>QR Code disponível após a publicação do vídeo</span>
            }
          </div>
        } @else {
          <div class="unavailable-media"><app-checklist-icon name="file-text" /><span>Imagem indisponível</span></div>
        }
        <figcaption>{{ item.name }}</figcaption>
      </figure>
    }
  </div>
}
