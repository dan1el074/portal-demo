<c-modal modalBackNavigation [visible]="visible" (visibleChange)="visible = $event" alignment="center" backdrop="static" size="lg">
  <c-modal-header><h5 cModalTitle>Novo checklist</h5><button cButtonClose type="button" aria-label="Fechar" cTooltip="Fechar" cTooltipPlacement="bottom" (click)="close()"></button></c-modal-header>
  <c-modal-body><p class="description">Selecione a categoria e o modelo. Etapas automáticas são criadas pelo próprio fluxo.</p><div class="form-grid"><label>Categoria<select cSelect [(ngModel)]="categoryId" (ngModelChange)="categoryChanged()">@for (category of store.state().categories; track category.id) { @if (category.active && store.canOperate(category.id)) { <option [value]="category.id">{{ category.name }}</option> } }</select></label><label>Modelo<select cSelect [(ngModel)]="templateId" (ngModelChange)="templateChanged()"><option value="">Selecione</option>@for (model of templates; track model.id) { <option [value]="model.id">{{ model.name }}</option> }</select></label></div>@if (needsPredecessor) { <label class="previous-label">Registro anterior<select cSelect [(ngModel)]="predecessorId"><option value="">Selecione o checklist finalizado</option>@for (record of predecessors; track record.id) { <option [value]="record.id">{{ store.flow(record).serial || store.title(record) }} · {{ record.finished | date:'dd/MM/yyyy HH:mm':'-0300' }}</option> }</select><small>O sistema manterá o vínculo do fluxo internamente.</small></label> }</c-modal-body>
  <c-modal-footer><button cButton type="button" color="secondary" variant="outline" (click)="close()">Cancelar</button><button cButton type="button" color="primary" [disabled]="!templateId || (needsPredecessor && !predecessorId)" (click)="confirm()">Continuar</button></c-modal-footer>
</c-modal>
