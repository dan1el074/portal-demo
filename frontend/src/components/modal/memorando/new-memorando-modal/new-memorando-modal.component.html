<c-modal modalBackNavigation [visible]="visible" alignment="center" backdrop="static" id="newMemorandoModal" >
  <form [formGroup]="newMemorandoForm" (ngSubmit)="onSubmit()" autocomplete="off">
    <c-modal-header>
      <svg [cIcon]="icons.cilPencil" class="modal-title-icon" size="lg"></svg>
      <h5 cModalTitle>Novo registro - Memorando</h5>
      <button (click)="closeMemorandoModal()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>

    <fieldset class="erp-selector">
      <legend>Origem dos dados</legend>
      <label class="erp-option" [class.selected]="newMemorandoForm.get('source')?.value === 'FOCCO'">
        <input type="radio" formControlName="source" value="FOCCO">
        <span><strong>FoccoERP</strong><small>Novo ERP</small></span>
      </label>
      <label class="erp-option" [class.selected]="newMemorandoForm.get('source')?.value === 'PROBUS'">
        <input type="radio" formControlName="source" value="PROBUS">
        <span><strong>Probus</strong><small>ERP antigo</small></span>
      </label>
    </fieldset>

    <label cLabel for="orderNumber">Número do pedido</label>
    <input cFormControl formControlName="orderNumber" [valid]="!showErrors ? undefined: newMemorandoForm.get('orderNumber')?.errors != null ? false : undefined" id="orderNumber" type="text" />
    @if (showErrors && newMemorandoForm.get('orderNumber')?.errors != null) {
      <div class="text-danger">
        Escreva um número de pedido válido!
      </div>
    }

    </c-modal-body>
    <c-modal-footer>
      <button cButton color="secondary" (click)="closeMemorandoModal()">Cancelar</button>
      <button cButton color="primary" type="submit">Continuar</button>
    </c-modal-footer>
  </form>
</c-modal>
