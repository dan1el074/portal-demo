<c-modal alignment="center" backdrop="static" id="new-post-modal" scrollable [visible]="visible" (visibleChange)="handleToggleModal($event)">
  <c-modal-header>
    <h5 cModalTitle>{{ editingPost ? 'Editar post' : 'Criar post' }}</h5>
    <button (click)="closeModal()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body class="main">
    <div class="user-container">
      <c-avatar shape="rounded-1" size="md" [src]="user.pictureId ? apiUrl + '/images/' + user.pictureId : './assets/images/avatars/default.png'" textColor="primary" alt="Avatar do usuário" />
      <div class="title-container"><strong>{{ user.name }}</strong><span>{{ user.position }}</span></div>
    </div>
    <textarea name="text-content" rows="5" placeholder="No que você está pensando?" [(ngModel)]="textContent"></textarea>
    @if (previews.length) {
      <div class="preview-container">
        @for (preview of previews; track preview.url) {
          <div class="preview-item">
            <img [src]="preview.url" [alt]="'Imagem ' + ($index + 1)" />
            <button class="preview-remove" (click)="removeImage($index)" type="button" aria-label="Remover imagem"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
          </div>
        }
        @if (previews.length < maxImages) { <button class="preview-add" type="button" (click)="fileInput.click()" aria-label="Adicionar mais imagens">+</button> }
      </div>
    }
    <div class="buttons-container">
      <span>Adicionar ao post:</span>
      <input #fileInput type="file" accept=".png,.jpeg,.jpg,.webp" multiple hidden (change)="onFilesSelected($event)" />
      <button (click)="fileInput.click()" cTooltip="Adicionar imagens" [class.active]="previews.length" class="media-btn" type="button" aria-label="Adicionar imagens"><span class="media-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m4 17 5-5 4 4 2-2 5 4"></path></svg></span></button>
    </div>
  </c-modal-body>
  <c-modal-footer><button cButton color="secondary" (click)="closeModal()">Cancelar</button><button cLoadingButton [loading]="loading" (click)="onPublish()">Publicar</button></c-modal-footer>
</c-modal>
